name: Generate Gource Video

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gource ffmpeg

      - name: Generate Gource video
        run: |
          gource -1920x1080 -o gource.mp4 \
            --title "pwnagotchijay" \
            --hide filenames,progress,users,mouse \
            --seconds-per-day 0.1 \
            --auto-skip-seconds 0.2 \
            --multi-sampling \
            --stop-at-end

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource.mp4
          git diff --staged --quiet || git commit -m "chore: update gource video"
          git push
