[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools==80.9.0"

[project]
name = "pwnagotchi"
dynamic = ["version"]
dependencies = [
    "PyYAML==6.0.3", "dbus-python==1.3.2", "file-read-backwards==3.0.0", "flask==3.1.3", "flask==3.1.3",
    "flask==3.1.3", "gpiozero==2.0.1", "inky==2.0.0", "pycryptodome==3.23.0", "python-dateutil==2.9.0",
    "requests==2.34.2", "rpi-lgpio==0.6", "rpi_hardware_pwm==0.1.0", "scapy==2.7.0", "setuptools==80.9.0", "smbus==1.1.post2", "smbus==1.1.post2",
    "spidev==3.6", "toml==0.10.2", "toml==0.10.2", "tweepy==4.15.0", "websockets==17.1", "pisugar==1.0.0",
    # REMOVED: "numpy==1.26.4", "gast", "shimmy" - were AI training pipeline dependencies only
]

requires-python = ">=3.11"
authors = [
  {name = "Evilsocket", email = "evilsocket@gmail.com"},
  {name = "Jayofelony", email = "oudshoorn.jeroen@gmail.com"}
]
maintainers = [
  {name = "Jayofelony", email = "oudshoorn.jeroen@gmail.com"}
]
description = "(⌐■_■) - Deep Reinforcement Learning instrumenting bettercap for WiFI pwning."
readme = "README.md"
license = {file = "LICENSE.md"}
classifiers = [
    'Programming Language :: Python :: 3.11',
    'Development Status :: 5 - Production/Stable',
    'License :: OSI Approved :: GNU General Public License (GPL)',
    'Environment :: Console',
]

[tool.setuptools.dynamic]
version = {attr = "pwnagotchi.__version__"}

[tool.setuptools.packages.find]
include = ["pwnagotchi"]
exclude = ["stage3"]

[project.urls]
Homepage = "https://pwnagotchi.org/"
Documentation = "https://github.com/jayofelony/pwnagotchi/wiki"
Repository = "https://github.com/jayofelony/pwnagotchi.git"
GitHub = "https://github.com/jayofelony/pwnagotchi"
Issues = "https://github.com/jayofelony/pwnagotchi/issues"
Download = "https://github.com/jayofelony/pwnagotchi/releases/latest"

[project.scripts]
pwnagotchi = "pwnagotchi.cli:pwnagotchi_cli"